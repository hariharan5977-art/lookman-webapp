<div class="controls">
  <button onclick="playReveal(2500)">Play Reveal (2.5s)</button>
  <button onclick="playReveal(4500)">Slow Motion (4.5s)</button>
</div>

<script>
const motionPath = document.getElementById('motion-path');
const maskStroke = document.getElementById('mask-stroke');
const sparkleFollower = document.getElementById('sparkle-follower');
const totalLen = motionPath.getTotalLength();

maskStroke.style.strokeDasharray = totalLen;
maskStroke.style.strokeDashoffset = totalLen;

let animId = null;

function playReveal(duration) {
  if (animId) cancelAnimationFrame(animId);
  const startTime = performance.now();
  
  function frame(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1.0);
    // Smooth luxury easeInOut
    const ease = progress < 0.5 
      ? 2 * progress * progress 
      : 1 - Math.pow(-2 * progress + 2, 2) / 2;
    
    const curLen = ease * totalLen;
    maskStroke.style.strokeDashoffset = totalLen - curLen;
    
    const pt = motionPath.getPointAtLength(curLen);
    sparkleFollower.setAttribute('transform', `translate(${pt.x}, ${pt.y})`);
    
    if (progress < 1.0) {
      animId = requestAnimationFrame(frame);
    } else {
      sparkleFollower.setAttribute('transform', 'translate(702, 2)');
      // Trigger stationary glint twinkle
      sparkleFollower.classList.add('glint-active');
    }
  }
  
  sparkleFollower.classList.remove('glint-active');
  animId = requestAnimationFrame(frame);
}

// Start on load
window.addEventListener('load', () => playReveal(2500));
</script>
